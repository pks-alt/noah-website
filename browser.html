<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOAH Homepage Browser Preview</title>
<style>
html,body{margin:0;min-height:100%;background:#fff;font-family:Inter,system-ui,sans-serif}
.loading{min-height:100vh;display:grid;place-items:center;color:#52616b;font-size:14px}
</style>
</head>
<body>
<div class="loading">Loading NOAH homepage…</div>
<script>
(async()=>{
  try{
    const res=await fetch('./index.html?preview=1',{cache:'no-store'});
    let html=await res.text();
    const base=location.href.replace(/browser\.html(?:\?.*)?$/,'');
    const logo=base+'assets/noah-logo.png';
    html=html.replaceAll('src="assets/noah-logo.png"','src="'+logo+'"');
    html=html.replace('.logo{width:188px;height:auto;display:block}', '.logo{width:220px;height:auto;display:block}');
    html=html.replace('.footer-logo{width:180px;height:auto}', '.footer-logo{width:190px;height:auto}');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading">Preview could not load. Refresh once.</div>';
  }
})();
</script>
</body>
</html>
