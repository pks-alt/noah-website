name: Add the approved NOAH browser icon only
on:
  push:
    branches: [preview-original-2176d74]
    paths: [.github/workflows/add-noah-favicon-only.yml]
permissions:
  contents: write
concurrency:
  group: noah-favicon-only
  cancel-in-progress: false
jobs:
  favicon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 65890fe335dd9028d332f1e146622039d0787125
          persist-credentials: false
      - name: Export browser icons from the original N and add head links only
        run: |
          python -m pip install --quiet pillow
          mkdir -p /tmp/noah-favicon-evidence
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib,json,subprocess
          root=Path('.')
          originals={name:Path(name).read_bytes() for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if name and Path(name).is_file()}
          raw=Path('assets/noah-lockup.png').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='9f629308ed06f713860b95835a3e6fc3e701f5e9'
          logo=Image.open('assets/noah-lockup.png').convert('RGBA')
          assert logo.size==(216,46)
          mark=logo.crop((0,0,51,46))
          def square(size):
              pad=max(1,round(size/16))
              scale=min((size-2*pad)/mark.width,(size-2*pad)/mark.height)
              fitted=mark.resize((round(mark.width*scale),round(mark.height*scale)),Image.Resampling.LANCZOS)
              canvas=Image.new('RGBA',(size,size),'white')
              canvas.alpha_composite(fitted,((size-fitted.width)//2,(size-fitted.height)//2))
              return canvas.convert('RGB')
          icons={'favicon-32.png':32,'favicon-96.png':96,'apple-touch-icon.png':180}
          for name,size in icons.items():
              assert not Path(name).exists()
              square(size).save(name,optimize=True)
          assert not Path('favicon.ico').exists()
          square(64).save('favicon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64)],append_images=[square(n) for n in [16,32,48]])
          block=b'\n<link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48 64x64">\n<link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">\n<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">\n<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">\n'
          pages=sorted(root.glob('*.html'))
          assert len(pages)==10
          for page in pages:
              old=page.read_bytes()
              assert b'rel="icon"' not in old and b'apple-touch-icon' not in old
              assert old.count(b'</head>')==1
              new=old.replace(b'</head>',block+b'</head>',1)
              assert new.replace(block,b'',1)==old
              assert new.split(b'<body',1)[1]==old.split(b'<body',1)[1]
              page.write_bytes(new)
          for name,old in originals.items():
              current=Path(name).read_bytes()
              assert (current.replace(block,b'',1) if name.endswith('.html') else current)==old, 'Unexpected change: '+name
          report={'baseline':'65890fe335dd9028d332f1e146622039d0787125','pages':len(pages),'change':'Only favicon link tags before closing head and four new browser-icon exports','all_existing_non_html_files_byte_identical':True,'all_page_bodies_byte_identical':True,'approved_logo_byte_identical':True,'icon_source_crop':[0,0,51,46],'png_sizes':icons,'ico_sizes':sorted(list(Image.open('favicon.ico').ico.sizes()))}
          Path('/tmp/noah-favicon-evidence/source-check.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - name: Commit only the favicon update to the handoff branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          expected=65890fe335dd9028d332f1e146622039d0787125
          remote=$(git -c credential.helper='!gh auth git-credential' ls-remote origin refs/heads/developer-handoff-final | cut -f1)
          test "$remote" = "$expected" || { echo 'Handoff branch moved; stop without overwriting.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' favicon.ico favicon-32.png favicon-96.png apple-touch-icon.png
          test "$(git diff --cached --name-only | wc -l)" -eq 14
          git commit -m 'Add approved NOAH N favicon to all pages without changing design or content'
          git -c credential.helper='!gh auth git-credential' push origin HEAD:developer-handoff-final
          git rev-parse HEAD > /tmp/noah-favicon-evidence/source-commit.txt
          git archive --format=zip --output=/tmp/noah-favicon-evidence/noah-final-source.zip HEAD
      - name: Prepare complete unchanged site with preview-only noindex headers
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,json,subprocess
          target=Path('/tmp/noah-favicon-preview');target.mkdir()
          for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if not name:continue
              p=Path(name)
              if p.suffix.lower() in ['.html','.css','.js','.png','.webp','.avif','.ico','.txt','.xml']:
                  q=target/p;q.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,q)
          (target/'ship.json').write_text(json.dumps({'headers':[{'source':'/(.*)','headers':[{'key':'X-Robots-Tag','value':'noindex, nofollow'}]}]}))
          PY
      - name: Publish complete preview
        run: |
          npx -y @shipstatic/ship /tmp/noah-favicon-preview --json --no-spa-detect --no-path-detect --label noah-n-favicon > /tmp/noah-favicon-deployment-private.json
          cat > /tmp/noah-favicon-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAoR873YsSY8xe2Mp4H536
          biXxHkBngPEayCIiSQ9e8w+qiAtncsJiy8TQHb1qEYsRN4rxESv8hCNIWWHyVt3/
          r8AIX43ofVUdgVWedBUI99ByXu0U+uw8tovITItTQ1mlUv62AFdKLj6NzukkMcJw
          k/z7WmFY/mLyZFhwg55OLl92/xMrfkjniDUVKd99ibkRe43T0jUG1q2qahGlOd9S
          ERX5TWAh/ggaivKDaEH+AoFLgIGKsv7P/OhG3CY2+qebu83yMAw3+5sCgZ498oV1
          hvoJKAVvUbVvOGlFoAvARpGFhUWah4mCOFJufXkfiGT8BpMq2NaAF8yGzDnqvao9
          VwIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          d=json.loads(Path('/tmp/noah-favicon-deployment-private.json').read_text())
          if isinstance(d.get('data'),dict):d=d['data']
          claim=d.pop('claim',None)
          if claim:subprocess.run(['openssl','pkeyutl','-encrypt','-pubin','-inkey','/tmp/noah-favicon-public.pem','-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256','-out','/tmp/noah-favicon-evidence/claim.enc'],input=claim.encode(),check=True)
          assert d.get('url')
          Path('/tmp/noah-favicon-evidence/deployment.json').write_text(json.dumps(d,indent=2))
          print('Browser review URL:',d['url'])
          PY
      - name: Verify all favicon files and all page declarations on the live preview
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.parse,hashlib,io
          from pathlib import Path
          from html.parser import HTMLParser
          from PIL import Image
          root=Path('/tmp/noah-favicon-evidence');base=json.loads((root/'deployment.json').read_text())['url'].rstrip('/')
          class Icons(HTMLParser):
              def __init__(self):super().__init__();self.icons=[]
              def handle_starttag(self,t,a):
                  a=dict(a)
                  if t=='link' and a.get('rel') in ['icon','apple-touch-icon']:self.icons.append(a)
          rows=[]
          for name in ['favicon.ico','favicon-32.png','favicon-96.png','apple-touch-icon.png']:
              with urllib.request.urlopen(base+'/'+name,timeout=30) as r:
                  data=r.read();status=r.status;mime=r.headers.get('Content-Type')
              assert data==Path(name).read_bytes(),name
              im=Image.open(io.BytesIO(data));im.load()
              rows.append({'file':name,'status':status,'mime':mime,'size':im.size,'matches_export':True})
          pages=[]
          for p in sorted(Path('.').glob('*.html')):
              with urllib.request.urlopen(base+'/'+p.name,timeout=30) as r:
                  text=r.read().decode();status=r.status
              parser=Icons();parser.feed(text)
              assert status==200 and len(parser.icons)==4,p.name
              assert {urllib.parse.urlparse(x['href']).path for x in parser.icons}=={'/favicon.ico','/favicon-32.png','/favicon-96.png','/apple-touch-icon.png'},p.name
              pages.append({'page':p.name,'status':status,'icons':parser.icons})
          (root/'http-check.json').write_text(json.dumps({'icons':rows,'pages':pages},indent=2))
          print('Verified four icon exports and favicon declarations on all ten pages.')
          PY
      - name: Open the site with agent-browser
        run: |
          URL=$(python -c "import json;print(json.load(open('/tmp/noah-favicon-evidence/deployment.json'))['url'])")
          npx -y agent-browser --executable-path /usr/bin/google-chrome --session noah-favicon open "$URL"
          npx -y agent-browser --session noah-favicon wait --load networkidle
          npx -y agent-browser --session noah-favicon snapshot -i > /tmp/noah-favicon-evidence/interactive.txt
          npx -y agent-browser --session noah-favicon close
      - name: Check browser loading and capture the actual browser tab icon
        run: |
          python -m pip install --quiet playwright
          cat > /tmp/noah-favicon-browser.py <<'PY'
          import json,shutil,sqlite3,time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from PIL import ImageGrab
          root=Path('/tmp/noah-favicon-evidence');base=json.loads((root/'deployment.json').read_text())['url'].rstrip('/')
          rows=[];errors=[];icon_requests=[]
          with sync_playwright() as p:
              ctx=p.chromium.launch_persistent_context('/tmp/noah-favicon-browser-profile',executable_path=shutil.which('google-chrome'),headless=False,no_viewport=True,args=['--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1000'])
              page=ctx.pages[0]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.on('response',lambda r:icon_requests.append({'url':r.url,'status':r.status}) if any(x in r.url for x in ['favicon','apple-touch-icon']) else None)
              for name in sorted(x.name for x in Path('.').glob('*.html')):
                  errors.clear();response=page.goto(base+'/'+name,wait_until='networkidle',timeout=45000)
                  info=page.evaluate('''async()=>{const links=[...document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]')];const decoded=await Promise.all(links.map(async l=>{const i=new Image();i.src=l.href;await i.decode();return {href:l.href,width:i.naturalWidth,height:i.naturalHeight}}));return {title:document.title,icons:decoded,h1:document.querySelectorAll('h1').length,logoLoaded:!!document.querySelector('.logo')?.naturalWidth}}''')
                  info.update({'page':name,'status':response.status,'script_errors':errors.copy()});rows.append(info)
                  assert info['status']==200 and len(info['icons'])==4 and info['logoLoaded'] and not errors,name
              page.goto(base,wait_until='networkidle');page.wait_for_timeout(1500)
              page.screenshot(path=str(root/'homepage.png'))
              ImageGrab.grab().save(root/'browser-with-N-tab.png')
              ctx.close()
          db=Path('/tmp/noah-favicon-browser-profile/Default/Favicons')
          cache=[]
          if db.exists():
              con=sqlite3.connect(str(db));cache=con.execute('SELECT m.page_url,f.url FROM icon_mapping m JOIN favicons f ON m.icon_id=f.id').fetchall();con.close()
          (root/'browser-check.json').write_text(json.dumps({'pages':rows,'icon_responses':icon_requests,'browser_cached_icons':cache},indent=2))
          print('Browser page checks:',len(rows),'Cached favicon associations:',len(cache))
          PY
          xvfb-run -a -s '-screen 0 1440x1000x24' python /tmp/noah-favicon-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noah-favicon-evidence
          path: /tmp/noah-favicon-evidence/
          retention-days: 7
