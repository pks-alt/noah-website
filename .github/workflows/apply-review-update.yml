name: Apply approved presentation cleanup
on:
  push:
    branches: [developer-handoff-final]
    paths: [.github/revision-payload.b64]
permissions:
  contents: write
concurrency:
  group: noah-presentation-revision
  cancel-in-progress: false
jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and apply the reviewed revision
        run: |
          mkdir -p /tmp/noah-revision /tmp/noah-evidence
          python - <<'PY'
          import base64,hashlib,json,zipfile,io
          from pathlib import Path
          data=base64.b64decode(Path('.github/revision-payload.b64').read_text())
          assert hashlib.sha256(data).hexdigest()=='d9ff5380dba29031417b23a244a8edb40d16df0e8a10bf97d37a2a8c0aa26651', 'Revision bundle checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert all(not n.startswith('/') and '..' not in Path(n).parts for n in z.namelist())
              z.extractall('/tmp/noah-revision')
          expected=json.loads(Path('/tmp/noah-revision/expected-source.json').read_text())
          for name,digest in expected.items():
              assert Path(name).is_file() and hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest, 'Source changed: '+name
          PY
          python -m pip install --quiet beautifulsoup4
          python /tmp/noah-revision/apply_revision.py
          python /tmp/noah-revision/finalize_revision.py
          python tools/check_content.py > /tmp/noah-evidence/source-check.json
          git restore .github/workflows/review-source.yml
          rm .github/revision-payload.b64
      - name: Commit only to the handoff branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          remote=$(git -c credential.helper='!gh auth git-credential' ls-remote origin refs/heads/developer-handoff-final | cut -f1)
          test "$remote" = "$GITHUB_SHA" || { echo 'Branch moved. Stop instead of overwriting.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove decorative symbols and mock visuals; simplify site copy and prevent runtime regressions'
          git -c credential.helper='!gh auth git-credential' push origin HEAD:developer-handoff-final
          git rev-parse HEAD > /tmp/noah-evidence/source-commit.txt
          git archive --format=zip --output=/tmp/noah-evidence/noah-revised-source.zip HEAD
      - name: Prepare a complete same-origin review site
        run: |
          python - <<'PY'
          import shutil,json,re
          from pathlib import Path
          target=Path('/tmp/noah-preview');target.mkdir(exist_ok=True)
          for pattern in ['*.html','*.css']:
              for p in Path('.').glob(pattern):
                  text=p.read_text()
                  if p.suffix=='.html':
                      text=re.sub(r'(<meta\s+[^>]*name=[\"\x27]robots[\"\x27][^>]*content=[\"\x27])[^\"\x27]+',r'\g<1>noindex,nofollow',text,flags=re.I)
                  (target/p.name).write_text(text)
          shutil.copy2('site-shell.js',target/'site-shell.js')
          (target/'assets').mkdir(exist_ok=True)
          shutil.copy2('assets/noah-lockup.png',target/'assets/noah-lockup.png')
          (target/'robots.txt').write_text('User-agent: *\nAllow: /\n')
          (target/'ship.json').write_text(json.dumps({'headers':[{'source':'/(.*)','headers':[{'key':'X-Robots-Tag','value':'noindex, nofollow'}]}]}))
          PY
      - name: Publish full review build
        run: |
          npx -y @shipstatic/ship /tmp/noah-preview --json --no-spa-detect --no-path-detect --label noah-text-review > /tmp/noah-deployment-private.json
          cat > /tmp/claim-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAl5ho5Xn/Sqwqj63280Rq
          pVeuGyUezkBCbv0hZ6I/b2U1jI/b2U1jI9PvdtW2G6lNwALgjJKw3FYWuK41lId2Zg5CA2l
          PzWf9rasy1hhqIuGvMltA4mn+B2Dz8mpRNqRKsvh8VunMx9OidWfncfQJ2PglwfS
          DBe6rfu3U/jFowfwSpYRQFHQrja6R2Eejt0Y7369dYOcEQA7x/oC4yzmeueoehgx
          gVCa57ORHV6l7/BXyb+gaqT2AeaIudYfYqJqI9IJIGMUIuQ0if/N+WR8mP0VuN1Z
          QC2G3GimDJWIK5cTjvQan06GjsJO7tKvomjwz8zUHXVOL+bZc6GOnkavEDXMV0z4
          xwIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          d=json.loads(Path('/tmp/noah-deployment-private.json').read_text())
          if isinstance(d.get('data'),dict): d=d['data']
          claim=d.pop('claim',None)
          if claim:
              subprocess.run(['openssl','pkeyutl','-encrypt','-pubin','-inkey','/tmp/claim-public.pem','-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256','-out','/tmp/noah-evidence/claim.enc'],input=claim.encode(),check=True)
          Path('/tmp/noah-evidence/review-deployment.json').write_text(json.dumps(d,indent=2))
          assert d.get('url'), 'Missing review URL'
          print('Review URL:',d['url'])
          PY
      - name: Verify all hosted pages and assets
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.parse
          from pathlib import Path
          from html.parser import HTMLParser
          d=json.loads(Path('/tmp/noah-evidence/review-deployment.json').read_text());base=d['url'].rstrip('/')+'/'
          class Scan(HTMLParser):
              def __init__(self):super().__init__();self.refs=[]
              def handle_starttag(self,t,a):
                  a=dict(a)
                  if t in ['img','script'] and 'src' in a:self.refs.append(a['src'])
                  if t=='link' and a.get('rel')=='stylesheet':self.refs.append(a.get('href',''))
          report=[];assets=set()
          for path in sorted(Path('/tmp/noah-preview').glob('*.html')):
              url=base+path.name
              with urllib.request.urlopen(url,timeout=30) as r:status=r.status;text=r.read().decode()
              p=Scan();p.feed(text)
              for ref in p.refs:assets.add(urllib.parse.urljoin(url,ref))
              report.append({'page':path.name,'status':status,'content':len(text)})
              assert status==200 and 'NOAH' in text
          for url in sorted(assets):
              assert url.startswith(base), 'External asset dependency: '+url
              with urllib.request.urlopen(url,timeout=30) as r:assert r.status==200
          Path('/tmp/noah-evidence/http-check.json').write_text(json.dumps({'pages':report,'assets_checked':len(assets)},indent=2))
          print('Hosted pages verified:',len(report),'Same-origin assets:',len(assets))
          PY
      - name: Verify the deployed site in Chromium
        run: |
          python -m pip install --quiet playwright
          python - <<'PY'
          import json,re,shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          base=json.loads(Path('/tmp/noah-evidence/review-deployment.json').read_text())['url'].rstrip('/')
          paths=sorted(p.name for p in Path('/tmp/noah-preview').glob('*.html'))
          rows=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=shutil.which('google-chrome') or shutil.which('chromium'),headless=True,args=['--no-sandbox'])
              page=browser.new_page();errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              for width in [1440,1024,768,390,320]:
                  page.set_viewport_size({'width':width,'height':950 if width>760 else 844})
                  for name in paths:
                      errors.clear();r=page.goto(base+'/'+name,wait_until='networkidle')
                      text=page.locator('body').inner_text()
                      data=page.evaluate('''() => ({h1:document.querySelectorAll('h1').length,svg:document.querySelectorAll('svg').length,overflow:document.documentElement.scrollWidth>innerWidth,images:[...document.images].every(i=>i.complete&&i.naturalWidth>0)})''')
                      data.update({'page':name,'width':width,'status':r.status,'errors':errors.copy(),'forbidden':bool(re.search(r'[\u2190-\u21ff\u27f0-\u27ff\u2900-\u297f\u2600-\u27bf\U0001f000-\U0001faff\u2022\u25cf\u2013\u2014]',text))})
                      if page.locator('.menu-button').is_visible():
                          page.locator('.menu-button').click();data['menu_open']=page.locator('#mobile-nav').is_visible();page.keyboard.press('Escape');data['menu_closed']=not page.locator('#mobile-nav').is_visible()
                      rows.append(data)
                      if width in [1440,390] and name in ['index.html','solutions.html','network.html','contact.html','privacy.html']:
                          page.screenshot(path=f'/tmp/noah-evidence/{name[:-5]}-{width}.png',full_page=True)
              browser.close()
          Path('/tmp/noah-evidence/browser-check.json').write_text(json.dumps(rows,indent=2))
          bad=[r for r in rows if r['status']!=200 or r['h1']!=1 or r['svg'] or r['overflow'] or not r['images'] or r['forbidden'] or r['errors'] or r.get('menu_open')==False or r.get('menu_closed')==False]
          print('Live Chromium combinations:',len(rows),'Issues:',len(bad))
          assert not bad, json.dumps(bad)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noah-presentation-review
          path: /tmp/noah-evidence/
          retention-days: 7
