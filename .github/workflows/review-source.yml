name: Review source bundle
on:
  workflow_dispatch:
  push:
    branches: [developer-handoff-final]
    paths: [.github/workflows/review-source.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the exact source revision
        run: |
          git archive --format=zip --output=noah-review-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: noah-review-source
          path: noah-review-source.zip
          retention-days: 7
