name: NOAH source review
on:
  workflow_dispatch:
  push:
    branches: [developer-handoff-final]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check content, local assets, anchors, and metadata
        run: python tools/check_content.py
      - name: Package the reviewed source
        run: git archive --format=zip --output=noah-review-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: noah-reviewed-source
          path: noah-review-source.zip
          retention-days: 7
